name: Local stack checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    # Match the Linux distribution supported by the pinned Playwright browser.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check backend scripts evaluation
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r backend/requirements.txt
      - run: python -m pip_audit -r backend/requirements-distributed.txt
      - run: npm --prefix frontend audit --omit=dev
      - run: docker compose config --quiet
      - name: Validate distributed Compose overlay
        run: |
          export AGENTFORGE_SECRET_POSTGRES="$(openssl rand -hex 32)"
          export AGENTFORGE_SECRET_REDIS="$(openssl rand -hex 32)"
          docker compose -f docker-compose.yml -f docker-compose.distributed.yml config --quiet
