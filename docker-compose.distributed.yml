x-worker-image: &worker-image
  context: .
  dockerfile: backend/Dockerfile
  args:
    AGENTFORGE_DISTRIBUTED: '1'

x-worker-env: &worker-env
  AGENTFORGE_EXECUTOR: distributed
  AGENTFORGE_DATABASE_URL: postgresql+psycopg://agentforge:${AGENTFORGE_SECRET_POSTGRES:?Set a URL-safe PostgreSQL password}@postgres:5432/agentforge
  AGENTFORGE_REDIS_URL: redis://:${AGENTFORGE_SECRET_REDIS:?Set a URL-safe Redis password}@redis:6379/0
  AGENTFORGE_SECRET_POSTGRES: ${AGENTFORGE_SECRET_POSTGRES:?Set a URL-safe PostgreSQL password}
  AGENTFORGE_SECRET_REDIS: ${AGENTFORGE_SECRET_REDIS:?Set a URL-safe Redis password}
  AGENTFORGE_SECRET_REVIEWER: ${AGENTFORGE_SECRET_REVIEWER:-}

services:
  backend:
    build: *worker-image
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentforge
      POSTGRES_DB: agentforge
      POSTGRES_PASSWORD: ${AGENTFORGE_SECRET_POSTGRES:?Set a URL-safe PostgreSQL password}
    volumes:
      - agentforge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agentforge", "-d", "agentforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 1.0
  redis:
    image: redis:7.4-alpine
    environment:
      REDISCLI_AUTH: ${AGENTFORGE_SECRET_REDIS:?Set a URL-safe Redis password}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${AGENTFORGE_SECRET_REDIS:?Set a URL-safe Redis password}"]
    volumes:
      - agentforge_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 0.5
  worker:
    build: *worker-image
    environment: *worker-env
    command: ["celery", "-A", "backend.app.celery_worker:app", "worker", "--loglevel=WARNING", "--concurrency=2", "--hostname=agentforge@%h"]
    volumes:
      - agentforge_runtime:/opt/runtime
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.app.celery_worker:app inspect ping --timeout 3 --destination agentforge@$$HOSTNAME"]
      interval: 20s
      timeout: 8s
      retries: 5
    init: true
    stop_grace_period: 45s
    mem_limit: 1536m
    cpus: 2.0

volumes:
  agentforge_postgres:
  agentforge_redis:
