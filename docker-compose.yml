services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - agentforge_runtime:/opt/runtime
    init: true
    stop_grace_period: 30s
    mem_limit: 1024m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    init: true
    stop_grace_period: 15s
    mem_limit: 128m
    cpus: 0.5
volumes:
  agentforge_runtime:
